<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 400 400" width="100%" height="100%">
    <defs>
        <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#1d4ed8" />
        </linearGradient>
        <linearGradient id="greenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#84cc16" />
            <stop offset="100%" stop-color="#06b6d4" />
        </linearGradient>
    </defs>
    
    <!-- Tiang Kiri 'M' -->
    <polygon points="30,360 30,160 80,220 80,360" fill="url(#blueGrad)"/>
    
    <!-- Tiang Kanan 'M' -->
    <polygon points="260,360 260,260 310,200 310,360" fill="url(#blueGrad)"/>

    <!-- Panah Tengah / Huruf 'V' -->
    <!-- Garis kiri V -->
    <polygon points="10,150 60,130 190,340 140,370" fill="url(#greenGrad)"/>
    
    <!-- Garis Kanan V (Batang Panah) -->
    <polygon points="140,370 190,340 350,90 300,120" fill="url(#greenGrad)"/>
    
    <!-- Kepala Panah -->
    <polygon points="370,40 370,150 260,40" fill="url(#greenGrad)"/>
</svg>
